[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simlev"
version = "0.1.0"
description = "Backtesting für ETF-, Hebel- und Multi-Asset-Strategien mit deutscher Investmentbesteuerung (bitgleiche Portierung des R-Pakets SimLev)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "ChemicalStats von der Mauerstrasse", email = "chemicalstatsy@protonmail.com" }]
keywords = ["backtesting", "portfolio", "etf", "leverage", "steuern", "vorabpauschale", "investmentsteuergesetz"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: German",
]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
plotly = ["plotly>=5"]
test = ["pytest>=7", "matplotlib>=3.5"]
all = ["matplotlib>=3.5", "plotly>=5"]

[tool.setuptools]
packages = ["simlev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
